# dsh-power bundle patch: mount this package into the profile.
#
# The profile is composed as patches: every bundle listed in
# package.json -> dsh.profile.bundles contributes one layer, then the profile's own
# cordis.patch.yml, then any --patch overlays. `name` must stay the package name so
# Node resolves the installed copy (never a source path).
#
# Every value below is the built-in default, so all of it can be omitted. To change
# anything, override the same id from the profile's own cordis.patch.yml — note that a
# later patch REPLACES the whole `config` object (there is no deep merge), so restate
# every key you still want.
- insert:
    - id: dsh-power
      name: 'dsh-power'
      # config:
      #   port: 0                        # 0 = discover from webServer/--port; set it only if discovery fails
      #   processName: DeepSeek Harness  # process name used to identify the app (only OUR instance's tree is stopped)
      #   exePath: ''                    # '' = process.execPath
      #   showRestart: true              # draw the restart half of the card
      #   showShutdown: true             # draw the shutdown half of the card
      #   confirmPower: true             # both actions need a second click; false = fire on first click
      #   confirmMs: 3000                # how long the pending question stays armed (>=1000)
      #   foreground: true               # after restart, bring the new window to the front
      #   logToTemp: true                # write %TEMP%\dsh-power.log
